<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    中華民國財稅會計學習交流協會電子簽到系統
  </title>

  <!-- 手機條碼掃描 -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

      background: #FFF6E0;
      color: #333;
    }

    .page {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 18px 40px;
    }


    /* =========================
       標題
    ========================= */

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo {
      width: auto;
      max-width: 145px;
      max-height: 145px;

      object-fit: contain;

      display: block;

      margin:
        0 auto
        14px;
    }

    .association-name {
      font-size: 24px;
      line-height: 1.45;
      font-weight: 800;

      color: #8E735A;

      margin-bottom: 6px;
    }

    .system-name {
      font-size: 20px;
      font-weight: 700;

      color: #AC8F6C;
    }


    /* =========================
       卡片
    ========================= */

    .card {
      background: #fff;

      padding: 22px;

      border-radius: 22px;

      box-shadow:
        0 6px 20px
        rgba(0,0,0,.07);
    }


    /* =========================
       輸入框
    ========================= */

    input {
      width: 100%;

      padding: 17px 16px;

      border:
        2px solid
        #ddd;

      border-radius: 14px;

      font-size: 21px;

      outline: none;

      margin-bottom: 12px;

      background: #fff;
    }

    input:focus {
      border-color:
        #AC8F6C;
    }


    /* =========================
       按鈕
    ========================= */

    button {
      width: 100%;

      border: 0;
      border-radius: 14px;

      padding: 16px;

      margin-bottom: 12px;

      font-size: 19px;
      font-weight: 700;

      cursor: pointer;
    }

    .brown-btn {
      background:
        #AC8F6C;

      color: #fff;
    }

    .scan-btn {
      background:
        #84AAA6;

      color: #fff;
    }

    .pink-btn {
      background:
        #FFA3B2;

      color: #fff;

      margin-top: 15px;
    }

    .gray-btn {
      background:
        #999;

      color: #fff;
    }

    button:disabled {
      opacity: .65;
      cursor: default;
    }


    /* =========================
       PIN
    ========================= */

    #loginArea {
      display: block;
    }

    #mainArea {
      display: none;
    }

    .pin-title {
      text-align: center;

      font-size: 18px;
      font-weight: 700;

      color: #6f6255;

      margin-bottom: 14px;
    }

    .login-note {
      text-align: center;

      font-size: 14px;
      color: #888;

      line-height: 1.7;
    }

    #loginMessage {
      margin-top: 12px;

      text-align: center;

      font-size: 17px;

      color: #C62828;
    }


    /* =========================
       主畫面
    ========================= */

    .logout {
      text-align: right;

      font-size: 13px;

      margin-bottom: 10px;
    }

    .logout a {
      color: #999;
      text-decoration: underline;
      cursor: pointer;
    }

    .hint {
      text-align: center;

      color: #888;

      font-size: 14px;

      line-height: 1.7;

      margin: 6px 0 14px;
    }


    /* =========================
       掃碼
    ========================= */

    #scannerArea {
      display: none;

      margin-top: 14px;

      padding: 14px;

      background: #fafafa;

      border-radius: 16px;
    }

    #reader {
      width: 100%;
      overflow: hidden;

      border-radius: 12px;
    }

    #stopBtn {
      display: none;
      margin-top: 12px;
    }


    /* =========================
       會員結果
    ========================= */

    #result {
      display: none;

      margin-top: 18px;

      padding: 20px;

      border-radius: 16px;

      background:
        #F8F8F8;

      font-size: 18px;
      line-height: 1.8;
    }

    .member-name {
      font-size: 27px;
      font-weight: 800;

      color: #333;

      margin-bottom: 10px;
    }

    .success {
      color: #2E7D32;
      font-weight: 700;
    }

    .warning {
      color: #B26A00;
      font-weight: 700;
    }

    .error {
      color: #C62828;
      font-weight: 700;
    }

    #checkinBtn {
      display: none;
    }


    /* =========================
       手機
    ========================= */

    @media (max-width: 480px) {

      .page {
        padding:
          20px 14px 32px;
      }

      .logo {
        max-width: 125px;
        max-height: 125px;
      }

      .association-name {
        font-size: 21px;
      }

      .system-name {
        font-size: 18px;
      }

      input {
        font-size: 19px;
      }

      button {
        font-size: 18px;
      }
    }

  </style>
</head>


<body>

<div class="page">


  <!-- =========================
       Logo + 標題
  ========================= -->

  <div class="header">

    <img
      class="logo"
      src="caccpa-logo.png"
      alt="中華民國財稅會計學習交流協會 Logo"
    >

    <div class="association-name">
      中華民國財稅會計學習交流協會
    </div>

    <div class="system-name">
      電子簽到系統
    </div>

  </div>



  <!-- =========================
       PIN
  ========================= -->

  <div
    id="loginArea"
    class="card"
  >

    <div class="pin-title">
      工作人員登入
    </div>

    <input
      id="pinInput"
      type="password"
      inputmode="numeric"
      placeholder="請輸入工作人員 PIN"
    >

    <button
      class="brown-btn"
      onclick="login()"
    >
      進入電子簽到系統
    </button>

    <div class="login-note">
      僅供工作人員使用
    </div>

    <div id="loginMessage"></div>

  </div>



  <!-- =========================
       簽到主畫面
  ========================= -->

  <div
    id="mainArea"
    class="card"
  >

    <div class="logout">
      <a onclick="logout()">
        更換工作人員 PIN
      </a>
    </div>


    <input
      id="memberCode"
      type="text"
      placeholder="請輸入會員編號"
      autocomplete="off"
    >


    <button
      class="brown-btn"
      onclick="searchMember()"
    >
      手動輸入
    </button>


    <button
      id="scanBtn"
      class="scan-btn"
      onclick="startScanner()"
    >
      📷 掃描會員證條碼
    </button>


    <div id="scannerArea">

      <div id="reader"></div>

      <button
        id="stopBtn"
        class="gray-btn"
        onclick="stopScanner()"
      >
        停止掃描
      </button>

      <div class="hint">
        請將會員證條碼橫向完整放入畫面中
      </div>

    </div>


    <div class="hint">
      可手動輸入會員編號，
      或直接掃描會員證條碼
    </div>


    <div id="result"></div>


    <button
      id="checkinBtn"
      class="pink-btn"
      onclick="confirmCheckIn()"
    >
      確認簽到
    </button>

  </div>

</div>



<script>

/* =========================
   GAS API
========================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzsCECSAwfIOURN8IF3-n24Uu4MaS1KGEqcGJTy9a1_oN7U_6nWajANNpj0PVteKk6z/exec';


/* =========================
   全域
========================= */

let currentPin = '';
let currentCode = '';

let scanner = null;
let scanning = false;


const loginArea =
  document.getElementById(
    'loginArea'
  );

const mainArea =
  document.getElementById(
    'mainArea'
  );

const pinInput =
  document.getElementById(
    'pinInput'
  );

const loginMessage =
  document.getElementById(
    'loginMessage'
  );

const memberCodeInput =
  document.getElementById(
    'memberCode'
  );

const resultBox =
  document.getElementById(
    'result'
  );

const checkinBtn =
  document.getElementById(
    'checkinBtn'
  );

const scanBtn =
  document.getElementById(
    'scanBtn'
  );

const stopBtn =
  document.getElementById(
    'stopBtn'
  );

const scannerArea =
  document.getElementById(
    'scannerArea'
  );


/* =========================
   開啟頁面
========================= */

window.addEventListener(
  'load',
  function() {

    const savedPin =
      sessionStorage.getItem(
        'checkinPin'
      );

    if (savedPin) {

      currentPin =
        savedPin;

      loginArea.style.display =
        'none';

      mainArea.style.display =
        'block';

    } else {

      loginArea.style.display =
        'block';

      mainArea.style.display =
        'none';

    }

  }
);


/* =========================
   Enter
========================= */

pinInput.addEventListener(
  'keydown',
  function(e) {

    if (e.key === 'Enter') {
      login();
    }

  }
);


memberCodeInput.addEventListener(
  'keydown',
  function(e) {

    if (e.key === 'Enter') {
      searchMember();
    }

  }
);


/* =========================
   PIN 登入
========================= */

function login() {

  const pin =
    pinInput.value.trim();


  if (!pin) {

    loginMessage.innerHTML =
      '<div class="warning">' +
      '請輸入工作人員 PIN' +
      '</div>';

    return;
  }


  loginMessage.textContent =
    '驗證中...';


  /*
    用不存在的會員編號測 PIN。
    PIN 正確 → NOT_FOUND
    PIN 錯誤 → INVALID_PIN
  */

  apiCall(
    'find',
    {
      code: '__PIN_TEST__',
      pin: pin
    }
  )

  .then(function(result) {

    if (
      result.type ===
      'INVALID_PIN'
    ) {

      loginMessage.innerHTML =
        '<div class="error">' +
        '工作人員 PIN 錯誤' +
        '</div>';

      return;
    }


    currentPin = pin;

    sessionStorage.setItem(
      'checkinPin',
      pin
    );


    loginArea.style.display =
      'none';

    mainArea.style.display =
      'block';

    loginMessage.innerHTML =
      '';

    memberCodeInput.focus();

  })

  .catch(function() {

    loginMessage.innerHTML =
      '<div class="error">' +
      '無法連線到簽到系統' +
      '</div>';

  });

}


/* =========================
   登出
========================= */

async function logout() {

  await stopScanner();

  sessionStorage.removeItem(
    'checkinPin'
  );

  currentPin = '';
  currentCode = '';

  pinInput.value = '';
  memberCodeInput.value = '';

  resultBox.style.display =
    'none';

  checkinBtn.style.display =
    'none';

  mainArea.style.display =
    'none';

  loginArea.style.display =
    'block';

}


/* =========================
   手動查詢
========================= */

function searchMember() {

  const code =
    normalizeCode(
      memberCodeInput.value
    );


  if (!code) {

    showResult(
      '<div class="warning">' +
      '請輸入會員編號' +
      '</div>'
    );

    checkinBtn.style.display =
      'none';

    return;
  }


  currentCode = code;

  showResult(
    '查詢中...'
  );

  checkinBtn.style.display =
    'none';


  apiCall(
    'find',
    {
      code: code,
      pin: currentPin
    }
  )

  .then(function(result) {


    /* PIN失效 */

    if (
      result.type ===
      'INVALID_PIN'
    ) {

      sessionStorage.removeItem(
        'checkinPin'
      );

      currentPin = '';

      mainArea.style.display =
        'none';

      loginArea.style.display =
        'block';

      loginMessage.innerHTML =
        '<div class="error">' +
        'PIN 已失效，請重新登入' +
        '</div>';

      return;
    }


    /* 查無 */

    if (!result.success) {

      showResult(
        '<div class="error">' +
        '⚠️ ' +
        escapeHtml(
          result.message
        ) +
        '</div>'
      );

      return;
    }


    currentCode =
      result.code;


    let html =

      '<div class="member-name">' +
      escapeHtml(
        result.name
      ) +
      '</div>' +

      '會員編號：' +
      escapeHtml(
        result.code
      ) +
      '<br>' +

      '報名狀態：' +
      (
        result.registered
          ? '✅ 已報名'
          : '⚠️ 未報名'
      ) +

      '<br>' +

      '簽到狀態：';


    if (
      result.checkedIn
    ) {

      html +=
        '<span class="success">' +
        '✅ 已簽到' +
        '</span>';


      if (
        result.checkInDate ||
        result.checkInTime
      ) {

        html +=
          '<br>' +
          '簽到時間：' +
          escapeHtml(
            result.checkInDate || ''
          ) +
          ' ' +
          escapeHtml(
            result.checkInTime || ''
          );

      }


      checkinBtn.style.display =
        'none';


    } else {


      html +=
        '尚未簽到';


      if (
        result.registered
      ) {

        checkinBtn.style.display =
          'block';

      } else {

        checkinBtn.style.display =
          'none';

      }

    }


    showResult(html);

  })

  .catch(function() {

    showResult(
      '<div class="error">' +
      '連線失敗，請稍後再試' +
      '</div>'
    );

  });

}


/* =========================
   確認簽到
========================= */

function confirmCheckIn() {

  if (!currentCode) {
    return;
  }


  checkinBtn.disabled =
    true;

  checkinBtn.textContent =
    '簽到中...';


  apiCall(
    'checkin',
    {
      code: currentCode,
      pin: currentPin
    }
  )

  .then(function(result) {


    checkinBtn.disabled =
      false;

    checkinBtn.textContent =
      '確認簽到';


    if (!result.success) {

      showResult(
        '<div class="warning">' +
        '⚠️ ' +
        escapeHtml(
          result.message
        ) +
        '</div>'
      );

      checkinBtn.style.display =
        'none';

      return;
    }


    showResult(

      '<div class="member-name">' +
      escapeHtml(
        result.name
      ) +
      '</div>' +

      '<div class="success">' +
      '✅ 簽到成功' +
      '</div>' +

      '會員編號：' +
      escapeHtml(
        result.code
      ) +

      '<br>' +

      '簽到時間：' +
      escapeHtml(
        result.checkInDate
      ) +
      ' ' +
      escapeHtml(
        result.checkInTime
      )

    );


    checkinBtn.style.display =
      'none';


    /*
      2 秒後準備下一位
    */

    setTimeout(
      resetForNextMember,
      2000
    );

  })

  .catch(function() {

    checkinBtn.disabled =
      false;

    checkinBtn.textContent =
      '確認簽到';


    showResult(
      '<div class="error">' +
      '簽到連線失敗，請稍後再試' +
      '</div>'
    );

  });

}


/* =========================
   掃描會員證
========================= */

async function startScanner() {

  resultBox.style.display =
    'none';

  checkinBtn.style.display =
    'none';


  if (scanning) {
    return;
  }


  try {

    scanner =
      new Html5Qrcode(
        'reader'
      );


    const config = {

      fps: 12,


      qrbox:
        function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const width =
            Math.min(
              Math.floor(
                viewfinderWidth *
                0.85
              ),
              360
            );


          return {

            width:
              width,

            height:
              120

          };

        },


      formatsToSupport: [

        Html5QrcodeSupportedFormats
          .CODE_39,

        Html5QrcodeSupportedFormats
          .CODE_128

      ]

    };


    scannerArea.style.display =
      'block';


    await scanner.start(

      {
        facingMode:
          'environment'
      },

      config,

      onScanSuccess,

      function() {
        // 掃描過程不用顯示辨識失敗
      }

    );


    scanning = true;


    scanBtn.style.display =
      'none';

    stopBtn.style.display =
      'block';


  } catch (error) {


    scannerArea.style.display =
      'none';


    showResult(

      '<div class="error">' +
      '無法開啟相機，' +
      '請改用手動輸入。' +
      '</div>'

    );

  }

}


/* =========================
   掃碼成功
========================= */

async function onScanSuccess(
  decodedText
) {

  const code =
    normalizeCode(
      decodedText
    );


  if (!code) {
    return;
  }


  await stopScanner();


  memberCodeInput.value =
    code;


  currentCode =
    code;


  showResult(

    '<div class="success">' +
    '✅ 已讀取會員證' +
    '</div>' +

    '會員編號：' +
    escapeHtml(code)

  );


  /*
    掃完自動查 Google Sheet
  */

  setTimeout(
    searchMember,
    250
  );

}


/* =========================
   停止掃描
========================= */

async function stopScanner() {

  try {

    if (
      scanner &&
      scanning
    ) {

      scanning = false;

      await scanner.stop();

      scanner.clear();

    }

  } catch (e) {

    // 不顯示

  }


  scannerArea.style.display =
    'none';


  scanBtn.style.display =
    'block';


  stopBtn.style.display =
    'none';

}


/* =========================
   下一位
========================= */

function resetForNextMember() {

  currentCode = '';

  memberCodeInput.value =
    '';

  resultBox.innerHTML =
    '';

  resultBox.style.display =
    'none';

  checkinBtn.style.display =
    'none';

  memberCodeInput.focus();

}


/* =========================
   GAS JSONP API
========================= */

function apiCall(
  action,
  params
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {


      const callbackName =

        'jsonp_' +

        Date.now() +

        '_' +

        Math.floor(
          Math.random() *
          100000
        );


      const script =
        document.createElement(
          'script'
        );


      const query =
        new URLSearchParams();


      query.set(
        'action',
        action
      );


      Object
        .keys(
          params || {}
        )
        .forEach(
          function(key) {

            query.set(
              key,
              params[key]
            );

          }
        );


      query.set(
        'callback',
        callbackName
      );


      window[
        callbackName
      ] =
        function(data) {

          resolve(data);

          cleanup();

        };


      script.onerror =
        function() {

          reject(
            new Error(
              'API連線失敗'
            )
          );

          cleanup();

        };


      function cleanup() {

        try {

          delete window[
            callbackName
          ];

        } catch (e) {}


        if (
          script.parentNode
        ) {

          script
            .parentNode
            .removeChild(
              script
            );

        }

      }


      script.src =

        API_URL +

        '?' +

        query.toString();


      document
        .body
        .appendChild(
          script
        );


      setTimeout(
        function() {

          if (
            window[
              callbackName
            ]
          ) {

            reject(
              new Error(
                'API逾時'
              )
            );

            cleanup();

          }

        },

        15000

      );

    }
  );

}


/* =========================
   工具
========================= */

function normalizeCode(
  value
) {

  return String(
    value || ''
  )

  .trim()

  .toUpperCase()

  .replace(
    /^\*/,
    ''
  )

  .replace(
    /\*$/,
    ''
  )

  .trim();

}


function showResult(
  html
) {

  resultBox.style.display =
    'block';

  resultBox.innerHTML =
    html;

}


function escapeHtml(
  value
) {

  return String(
    value || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}

</script>

</body>
</html>
