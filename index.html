<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>會員大會電子報到</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #FFF6E0;
      color: #333;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin: 20px 0;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 15px;
      font-size: 24px;
      border: 2px solid #ddd;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      font-size: 20px;
      cursor: pointer;
      margin-bottom: 14px;
    }

    #searchBtn {
      background: #AC8F6C;
      color: white;
    }

    #startBtn {
      background: #7FA6A1;
      color: white;
    }

    #stopBtn {
      background: #999;
      color: white;
      display: none;
    }

    #reader {
      width: 100%;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 12px;
    }

    #result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #f7f7f7;
      font-size: 20px;
      line-height: 1.7;
      display: none;
    }

    .name {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .success {
      color: #26834a;
      font-weight: bold;
    }

    .warning {
      color: #b26a00;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .hint {
      margin-top: 12px;
      color: #777;
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>🐻 會員大會電子報到</h1>

  <div class="card">

    <input
      id="memberCode"
      type="text"
      placeholder="輸入會員編號"
      autocomplete="off"
    >

    <button
      id="searchBtn"
      onclick="manualSearch()">
      查詢會員
    </button>

    <button
      id="startBtn"
      onclick="startScanner()">
      📷 開始掃會員證
    </button>

    <button
      id="stopBtn"
      onclick="stopScanner()">
      停止掃描
    </button>

    <div id="reader"></div>

    <div class="hint">
      可手動輸入會員編號，或直接掃會員證條碼。
    </div>

    <div id="result"></div>

  </div>

</div>


<script>

/*
  ⚠️ 這裡要換成你的 GAS Web App 網址
*/
const API_URL =
  '請把你的_GAS_WEB_APP網址_貼在這裡';

let scanner = null;
let scanning = false;

const memberCodeInput =
  document.getElementById('memberCode');

const resultBox =
  document.getElementById('result');


memberCodeInput.addEventListener(
  'keydown',
  function(e) {

    if (e.key === 'Enter') {
      manualSearch();
    }

  }
);


/* =========================
   手動查詢
========================= */

function manualSearch() {

  const code =
    normalizeCode(
      memberCodeInput.value
    );

  if (!code) {

    showMessage(
      '請輸入會員編號',
      'warning'
    );

    return;
  }

  lookupMember(code);
}


/* =========================
   啟動掃描
========================= */

async function startScanner() {

  const startBtn =
    document.getElementById('startBtn');

  const stopBtn =
    document.getElementById('stopBtn');

  resultBox.style.display = 'none';
  resultBox.innerHTML = '';

  try {

    scanner = new Html5Qrcode("reader");

    const config = {

      fps: 12,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const width =
          Math.min(
            Math.floor(
              viewfinderWidth * 0.85
            ),
            360
          );

        return {
          width: width,
          height: 120
        };
      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.CODE_128

      ]
    };


    await scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      function() {
        // 掃不到時不顯示錯誤
      }

    );


    scanning = true;

    startBtn.style.display = 'none';
    stopBtn.style.display = 'block';


  } catch (error) {

    showMessage(
      '無法開啟相機：' +
      String(error),
      'error'
    );
  }
}


/* =========================
   掃描成功
========================= */

async function onScanSuccess(
  decodedText,
  decodedResult
) {

  const code =
    normalizeCode(decodedText);

  if (!code) {
    return;
  }

  memberCodeInput.value = code;

  await stopScanner();

  lookupMember(code);
}


/* =========================
   停止掃描
========================= */

async function stopScanner() {

  const startBtn =
    document.getElementById('startBtn');

  const stopBtn =
    document.getElementById('stopBtn');

  try {

    if (
      scanner &&
      scanning
    ) {

      scanning = false;

      await scanner.stop();

      scanner.clear();
    }

  } catch (error) {

    console.log(error);
  }

  startBtn.style.display = 'block';
  stopBtn.style.display = 'none';
}


/* =========================
   查 Google Sheet
========================= */

function lookupMember(code) {

  showMessage(
    '查詢中...',
    ''
  );

  const callbackName =
    'jsonpCallback_' +
    Date.now();

  window[callbackName] =
    function(data) {

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      showMember(data);
    };


  const script =
    document.createElement('script');

  script.src =
    API_URL +
    '?action=find' +
    '&code=' +
    encodeURIComponent(code) +
    '&callback=' +
    encodeURIComponent(callbackName);

  script.onerror =
    function() {

      delete window[callbackName];

      showMessage(
        '連線失敗，請稍後再試',
        'error'
      );
    };

  document.body.appendChild(script);
}


/* =========================
   顯示會員資料
========================= */

function showMember(data) {

  resultBox.style.display = 'block';

  if (!data || !data.success) {

    resultBox.innerHTML =
      '<div class="error">' +
      '⚠️ ' +
      (
        data && data.message
          ? data.message
          : '查無會員資料'
      ) +
      '</div>';

    return;
  }

  resultBox.innerHTML =

    '<div class="name">' +
    escapeHtml(data.name) +
    '</div>' +

    '會員編號：' +
    escapeHtml(data.code) +
    '<br>' +

    '報名狀態：' +
    (
      data.registered
        ? '✅ 已報名'
        : '⚠️ 未報名'
    ) +

    '<br>' +

    '報到狀態：' +
    (
      data.checkedIn
        ? '✅ 已報到'
        : '尚未報到'
    );
}


/* =========================
   清理會員編號
========================= */

function normalizeCode(value) {

  return String(value || '')
    .trim()
    .toUpperCase()
    .replace(/^\*/, '')
    .replace(/\*$/, '')
    .trim();
}


/* =========================
   顯示訊息
========================= */

function showMessage(
  message,
  type
) {

  resultBox.style.display = 'block';

  resultBox.innerHTML =
    '<div class="' +
    type +
    '">' +
    escapeHtml(message) +
    '</div>';
}


/* =========================
   HTML 安全處理
========================= */

function escapeHtml(value) {

  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

</script>

</body>
</html>
